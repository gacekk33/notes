<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notatnik</title>
<style>
:root{color-scheme:light dark;--site-primary:#f5cf35;--site-secondary:#171717;--site-background:#111111;--site-on-primary:#171717;--site-on-secondary:#f8f4e8;--site-on-background:#f8f4e8;--site-font-body:Inter,system-ui,sans-serif;--site-font-heading:Inter,system-ui,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;--surface:light-dark(#fffdf4,#1b1b1b);--surface2:light-dark(#f4f0e3,#242424);--ink:light-dark(#171717,#f8f4e8);--muted:light-dark(#777365,#aaa69a);--line:light-dark(#e6dfc9,#393939)}*{box-sizing:border-box}body{margin:0;background:#111;color:#f8f4e8;font-family:var(--site-font-body)}button,input,textarea{font:inherit}button{cursor:pointer}#app{min-height:100vh;background:var(--site-background);color:var(--site-on-background)}.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,68px);border-bottom:1px solid #ffffff1c}.brand{font-weight:900;letter-spacing:-.04em;font-size:20px;display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--site-primary);color:#171717;font-weight:1000;transform:rotate(-5deg)}.top-label{color:#aaa;font-size:12px;letter-spacing:.14em;text-transform:uppercase}main{max-width:1120px;margin:auto;padding:clamp(28px,6vw,72px) 22px 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:34px}.eyebrow{color:var(--site-primary);font-size:12px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}h1{font-size:clamp(38px,6vw,66px);line-height:.98;letter-spacing:-.065em;margin:12px 0}.subtitle{color:#aaa69a;margin:0;line-height:1.6}.add-btn{border:0;background:var(--site-primary);color:#171717;padding:15px 20px;border-radius:14px;font-weight:850;box-shadow:0 8px 0 #b89519;transition:.2s}.add-btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #b89519}.add-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b89519}.toolbar{display:flex;justify-content:space-between;gap:14px;margin:36px 0 18px}.search{width:min(100%,340px);border:1px solid #444;background:#1c1c1c;color:white;padding:13px 15px;border-radius:12px;outline:none}.search:focus{border-color:var(--site-primary);box-shadow:0 0 0 3px #f5cf3528}.count{color:#aaa;font-size:13px}.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.note{min-height:190px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;text-align:left;position:relative;transition:.2s;animation:rise .4s both}.note:before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:var(--site-primary)}.note:hover{transform:translateY(-5px) rotate(-.4deg);border-color:#d4ad21;box-shadow:0 18px 50px #0002}.note-title{font-weight:850;font-size:19px;margin:4px 0 10px;overflow-wrap:anywhere}.note-preview{color:var(--muted);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}.note-bottom{display:flex;justify-content:space-between;margin-top:auto;padding-top:18px;color:var(--muted);font-size:11px}.open-hint{color:#9a7910;font-weight:800}.empty{grid-column:1/-1;border:1px dashed #555;border-radius:18px;padding:52px 20px;text-align:center;color:#aaa}.empty strong{display:block;color:white;font-size:20px;margin-bottom:8px}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5;backdrop-filter:blur(7px)}.overlay.show{display:flex;animation:fade .2s}.editor{width:min(100%,680px);background:var(--surface);color:var(--ink);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:0 25px 90px #0008;animation:pop .25s}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.editor h2{margin:0;font-size:25px}.close{border:0;width:36px;height:36px;border-radius:10px;background:var(--surface2);color:var(--ink);font-size:21px}.field{display:block;width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:14px 15px;outline:none;margin-bottom:13px}.field:focus{border-color:#d3ad22;box-shadow:0 0 0 3px #f5cf3525}textarea.field{resize:vertical;min-height:250px;line-height:1.6}.editor-actions{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.action-group{display:flex;gap:9px}.save{background:var(--site-primary);color:#171717;border:0;border-radius:11px;padding:12px 18px;font-weight:850}.delete{background:transparent;color:#d84c3f;border:1px solid #d84c3f66;border-radius:11px;padding:11px 14px;font-weight:750}.cancel{background:var(--surface2);color:var(--ink);border:0;border-radius:11px;padding:12px 15px}footer{text-align:center;color:#777;font-size:12px;padding:0 20px 28px}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:760px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}}@media(max-width:500px){.notes{grid-template-columns:1fr}.top-label{display:none}.toolbar{flex-direction:column}.search{width:100%}.editor-actions{flex-direction:column-reverse}.action-group{display:grid;grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div id="app"><header class="topbar"><div class="brand"><span class="logo">N</span> NOTATNIK<span style="color:var(--site-primary)">.</span></div><div class="top-label">Twoje myśli. Jedno miejsce.</div></header><main><section class="hero"><div><div class="eyebrow">Przestrzeń na pomysły</div><h1>Łap myśli.<br><span style="color:var(--site-primary)">Nie trać ich.</span></h1><p class="subtitle">Prosty notatnik, który pamięta za Ciebie.</p></div><button class="add-btn" id="addBtn">＋ Nowa notatka</button></section><div class="toolbar"><input class="search" id="search" type="search" placeholder="⌕  Szukaj notatek" aria-label="Szukaj notatek"><span class="count" id="count">0 notatek</span></div><section class="notes" id="notes" aria-live="polite"></section></main><footer>Twoje notatki zapisują się automatycznie na tym urządzeniu.</footer></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><section class="editor"><div class="editor-head"><h2 id="editorTitle">Nowa notatka</h2><button class="close" id="closeBtn" aria-label="Zamknij">×</button></div><input class="field" id="noteTitle" maxlength="90" placeholder="Tytuł notatki" aria-label="Tytuł notatki"><textarea class="field" id="noteBody" placeholder="Zapisz tutaj swoją myśl" aria-label="Treść notatki"></textarea><div class="editor-actions"><button class="delete" id="deleteBtn" hidden>Usuń notatkę</button><div class="action-group"><button class="cancel" id="cancelBtn">Anuluj</button><button class="save" id="saveBtn">Zapisz notatkę</button></div></div></section></div>
<script>(()=>{const KEY='zolty-notatnik-v1',$=id=>document.getElementById(id);let notes=[],editingId=null;try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(data)?data.filter(n=>n&&typeof n.id==='string'):[]}catch(e){}function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){alert('Nie udało się zapisać notatek.')}}function date(v){return new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'short',year:'numeric'}).format(new Date(v))}function render(){const q=$('search').value.trim().toLocaleLowerCase('pl'),filtered=notes.filter(n=>(n.title+' '+n.body).toLocaleLowerCase('pl').includes(q));$('count').textContent=notes.length+' '+(notes.length===1?'notatka':notes.length>=2&&notes.length<=4?'notatki':'notatek');$('notes').replaceChildren();if(!filtered.length){const box=document.createElement('div');box.className='empty';const strong=document.createElement('strong');strong.textContent=q?'Nic nie znaleziono':'Tu zaczyna się Twoja lista';const hint=document.createElement('span');hint.textContent=q?'Spróbuj wpisać inną frazę.':'Kliknij „Nowa notatka” i zapisz pierwszą myśl.';box.append(strong,hint);$('notes').append(box);return}filtered.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(n=>{const card=document.createElement('button');card.className='note';card.type='button';const title=document.createElement('div');title.className='note-title';title.textContent=n.title||'Bez tytułu';const body=document.createElement('div');body.className='note-preview';body.textContent=n.body||'Pusta notatka';const bottom=document.createElement('div');bottom.className='note-bottom';const d=document.createElement('span');d.textContent=date(n.updatedAt);const hint=document.createElement('span');hint.className='open-hint';hint.textContent='OTWÓRZ ↗';bottom.append(d,hint);card.append(title,body,bottom);card.addEventListener('click',()=>open(n.id));$('notes').append(card)})}function open(id=null){editingId=id;const n=notes.find(x=>x.id===id);$('editorTitle').textContent=n?'Edytuj notatkę':'Nowa notatka';$('noteTitle').value=n?n.title:'';$('noteBody').value=n?n.body:'';$('deleteBtn').hidden=!n;$('overlay').classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>$('noteTitle').focus(),20)}function close(){$('overlay').classList.remove('show');document.body.style.overflow='';editingId=null}function save(){const title=$('noteTitle').value.trim(),body=$('noteBody').value.trim();if(!title&&!body){$('noteTitle').focus();return}const now=Date.now();if(editingId){const n=notes.find(x=>x.id===editingId);if(n)Object.assign(n,{title,body,updatedAt:now})}else notes.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),title,body,createdAt:now,updatedAt:now});persist();render();close()}$('addBtn').addEventListener('click',()=>open());$('closeBtn').addEventListener('click',close);$('cancelBtn').addEventListener('click',close);$('saveBtn').addEventListener('click',save);$('deleteBtn').addEventListener('click',()=>{if(editingId&&confirm('Na pewno usunąć tę notatkę?')){notes=notes.filter(n=>n.id!==editingId);persist();render();close()}});$('search').addEventListener('input',render);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))close();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('overlay').classList.contains('show'))save()});render()})();</script></body></html>
